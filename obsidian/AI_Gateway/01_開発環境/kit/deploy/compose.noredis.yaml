# 運用版サンプル・Redisなし＝litellm×4＋内部LB（比較用）
# 使い方: cd deploy && docker-compose -f compose.noredis.yaml up -d --build
# 注意:   公式の線引きは「ワーカープロセスが2つ以上なら Redis」＝この構成ではレート制限・予算カウンタが
#         インスタンスごとに別勘定（実効値が台数倍）になる。常用は compose.yaml（Redisあり）
# 前提:   litellm_config.yaml（Redisなし既定）を使う／litellm_lb.conf は同フォルダの4台用
services:
  gateway:                         # 主軸（FastAPI/Python）。LiteLLM への接続先は http://litellm-lb:4000
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/workspace:Z
    working_dir: /workspace
    environment:
      - TZ=Asia/Tokyo
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
    command: ["uv", "run", "uvicorn", "ai_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      litellm-1:
        condition: service_healthy
      litellm-2:
        condition: service_healthy
      litellm-3:
        condition: service_healthy
      litellm-4:
        condition: service_healthy
      litellm-lb:
        condition: service_started

  web:                             # Flask＝ノートアプリ
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workspace/web
    init: true
    volumes:
      - ..:/workspace:Z
    env_file:
      - ../.env
    ports: ["5000:5000"]
    command: ["uv", "run", "flask", "--app", "app", "run", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      - gateway

  litellm-lb:                      # 内部ロードバランサ（4台用 conf）
    image: docker.io/library/nginx:alpine
    volumes: ["./litellm_lb.conf:/etc/nginx/conf.d/default.conf:ro,Z"]
    ports: ["4000:4000"]
    depends_on:
      - litellm-1
      - litellm-2
      - litellm-3
      - litellm-4

  litellm-1: &litellm              # LiteLLM インスタンス（ports公開なし＝入口はLBだけ）
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml"]
    volumes: ["../litellm_config.yaml:/app/config.yaml:Z"]
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  litellm-2: *litellm
  litellm-3: *litellm
  litellm-4: *litellm

  db:                              # LiteLLM の台帳（全インスタンスで共有）
    image: postgres:16
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_DB=litellm
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
