# compose ── gateway/web＋litellm×2＋内部LB（nginx）＋Redis＋Postgres
# 起動: docker compose up -d --build
#
# 認証の設計＝プロバイダ非依存（GCP・OpenAI等を入れ替え可能にする）:
#   秘密は「.env の環境変数」と「secrets/ に置くファイル」だけ。コンテナやCLIに依存しない。
#   Vertex AI なら認証JSON（SA鍵 or ADC）を secrets/ に置き、.env の GOOGLE_APPLICATION_CREDENTIALS で指す。
#   OpenAI 等に替えるなら .env のキーと litellm_config.yaml の model_list を差し替えるだけ。
#   下の gcloud サービスは「鍵JSONを用意できない場合に ADC を作る任意の補助」＝消しても本体に影響しない。
services:
  gateway:                         # 主軸（FastAPI/Python）。LiteLLM への接続先は .env の LITELLM_BASE_URL（=http://litellm-lb:4000）
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace:Z
    working_dir: /workspace
    environment:
      - TZ=Asia/Tokyo
      - LANG=ja_JP.UTF-8
      - LC_ALL=ja_JP.UTF-8
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
    command: ["uv", "run", "uvicorn", "ai_api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      litellm-1:
        condition: service_healthy
      litellm-2:
        condition: service_healthy
      litellm-lb:
        condition: service_started

  web:                             # Flask＝ノートアプリ役（仮実装の1画面）
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/web
    init: true
    volumes:
      - .:/workspace:Z
    env_file:
      - .env
    ports: ["5000:5000"]
    command: ["uv", "run", "flask", "--app", "app", "run", "--host", "0.0.0.0", "--port", "5000"]
    depends_on:
      - gateway

  litellm-lb:                      # 内部ロードバランサ（nginx）
    image: docker.io/library/nginx:alpine
    volumes: ["./litellm_lb.conf:/etc/nginx/conf.d/default.conf:ro,Z"]
    ports: ["4000:4000"]           # 管理UIもLB越しに http://localhost:4000/ui で届く
    depends_on:
      - litellm-1
      - litellm-2

  litellm-1: &litellm              # LiteLLM インスタンス（ports公開なし＝入口はLBだけ）
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml"]
    volumes:
      - "./litellm_config.yaml:/app/config.yaml:Z"
      - "./secrets:/secrets:ro"    # 認証ファイルの置き場（SA鍵JSON・ADCどちらも同じ置き方）。.env がパスを指す
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  litellm-2: *litellm              # YAMLアンカーで同一定義を複製（台数を足すときはここと litellm_lb.conf・gateway の depends_on を同数に）

  db:                              # LiteLLM の台帳（両インスタンスで共有）
    image: postgres:16
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_DB=litellm        # パスワードだけ .env の POSTGRES_PASSWORD から渡す
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:                           # 状態共有・spendバッファ（複数インスタンスでは必須＝有効化済み）
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gcloud:                          # 【任意の補助】鍵JSONを用意できない場合に ADC を作るワンショット（常駐しない）
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    profiles: ["auth"]             # 通常の up では起動しない。使い方: docker compose run --rm gcloud
    volumes:
      - ./secrets:/root/.config/gcloud    # ADC を secrets/ に直接書く（本体は secrets/ を読むだけ＝依存なし）
    command: ["gcloud", "auth", "application-default", "login", "--no-launch-browser"]

volumes:
  postgres_data:                   # 台帳の永続化（消えると鍵の発行からやり直し）
