# litellm 用 内部ロードバランサ（nginx）── 開発の本命（×2）
# インスタンス数を変えるときは server 行を compose 側と同数にする
upstream litellm_pool {
    server litellm-1:4000;
    server litellm-2:4000;
}

server {
    listen 4000;

    location / {
        proxy_pass http://litellm_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE/ストリーミングを素通しする
        proxy_read_timeout 300s;      # LLMの長い生成に合わせる（前段httpdのProxyTimeoutと揃える）
    }
}
